<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Details - Daraz Nepal</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gray-50 font-['Roboto']">
  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-2xl font-bold text-red-600">Daraz Nepal</a>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-red-600">Home</a>
        <a href="login.html" class="text-gray-700 hover:text-red-600">Login</a>
        <a href="cart.html" class="text-gray-700 hover:text-red-600 relative">
          <i class="fas fa-shopping-cart text-xl"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">0</span>
        </a>
      </nav>
      <button id="mobile-menu-btn" class="md:hidden text-gray-700 focus:outline-none">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md">
      <a href="index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Home</a>
      <a href="login.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Login</a>
      <a href="cart.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Cart</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto mt-8 px-4">
    <div id="product-detail" class="bg-white rounded shadow p-6 flex flex-col md:flex-row gap-6">
      <!-- Product details will be rendered here -->
    </div>
  </main>

  <script>
    // Get product id from URL query string
    function getProductId() {
      const params = new URLSearchParams(window.location.search);
      return parseInt(params.get('id'));
    }

    // Get cart from localStorage or empty array
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Update cart count in header
    function updateCartCount() {
      const cartCount = document.getElementById('cart-count');
      if (cartCount) {
        cartCount.textContent = cart.reduce((acc, item) => acc + item.quantity, 0);
      }
    }

    // Add product to cart
    function addToCart(product) {
      if (localStorage.getItem('isLoggedIn') !== 'true') {
        alert('Please login or signup to add products to cart.');
        window.location.href = 'login.html';
        return;
      }
      const cartItem = cart.find(i => i.id === product.id);
      if (cartItem) {
        cartItem.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert(`${product.name} added to cart.`);
    }

    // Render product details
    function renderProduct(product) {
      const container = document.getElementById('product-detail');
      if (!product) {
        container.innerHTML = '<p class="text-center text-gray-600">Product not found.</p>';
        return;
      }
      container.innerHTML = `
        <img src="${product.image}" alt="${product.name}" class="w-full md:w-1/2 rounded object-cover" />
        <div class="flex flex-col flex-grow">
          <h1 class="text-3xl font-bold mb-4">${product.name}</h1>
          <p class="text-red-600 font-bold text-2xl mb-4">Rs. ${product.price.toLocaleString()}</p>
          <p class="text-gray-700 mb-6">${product.description}</p>
          <button id="add-to-cart-btn" class="bg-red-600 text-white py-3 rounded hover:bg-red-700 transition w-full md:w-auto">
            Add to Cart
          </button>
        </div>
      `;

      document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        addToCart(product);
      });
    }

    // Mobile menu toggle
    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    // Sample product data (same as in app.js)
    const products = [
      {
        id: 1,
        name: "Samsung Galaxy S22",
        category: "Mobiles",
        price: 65000,
        image: "https://images.pexels.com/photos/404280/pexels-photo-404280.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260",
        description: "Latest Samsung flagship smartphone with powerful performance."
      },
      {
        id: 2,
        name: "Apple MacBook Pro 14\"",
        category: "Laptops",
        price: 220000,
        image: "https://images.pexels.com/photos/18105/pexels-photo.jpg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260",
        description: "Powerful laptop with M1 Pro chip for professionals."
      },
      {
        id: 3,
        name: "Men's Casual T-Shirt",
        category: "Fashion",
        price: 1200,
        image: "https://images.pexels.com/photos/428338/pexels-photo-428338.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260",
        description: "Comfortable cotton casual t-shirt for men."
      },
      {
        id: 4,
        name: "Modern Sofa Set",
        category: "Home & Living",
        price: 45000,
        image: "https://images.pexels.com/photos/1866149/pexels-photo-1866149.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260",
        description: "Stylish and comfortable sofa set for your living room."
      },
      {
        id: 5,
        name: "Children's Story Book",
        category: "Books",
        price: 350,
        image: "https://images.pexels.com/photos/590493/pexels-photo-590493.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260",
        description: "Engaging story book for children aged 5-10."
      },
      {
        id: 6,
        name: "Baby Stroller",
        category: "Baby & Toys",
        price: 15000,
        image: "https://images.pexels.com/photos/3661476/pexels-photo-3661476.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260",
        description: "Lightweight and foldable baby stroller for easy travel."
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const productId = getProductId();
      const product = products.find(p => p.id === productId);
      renderProduct(product);
      updateCartCount();

      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      mobileMenuBtn.addEventListener('click', toggleMobileMenu);
    });
  </script>
</body>
</html>
