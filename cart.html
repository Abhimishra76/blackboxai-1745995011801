<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Cart - Daraz Nepal</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gray-50 font-['Roboto']">
  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-2xl font-bold text-red-600">Daraz Nepal</a>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-red-600">Home</a>
        <a href="login.html" class="text-gray-700 hover:text-red-600">Login</a>
        <a href="cart.html" class="text-gray-700 hover:text-red-600 relative">
          <i class="fas fa-shopping-cart text-xl"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">0</span>
        </a>
      </nav>
      <button id="mobile-menu-btn" class="md:hidden text-gray-700 focus:outline-none">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md">
      <a href="index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Home</a>
      <a href="login.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Login</a>
      <a href="cart.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Cart</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto mt-8 px-4">
    <h1 class="text-3xl font-bold mb-6">Shopping Cart</h1>
    <div id="cart-items" class="bg-white rounded shadow p-6">
      <!-- Cart items will be rendered here -->
    </div>
    <div class="mt-6 flex justify-between items-center">
      <div class="text-xl font-semibold" id="cart-total">Total: Rs. 0</div>
      <a href="checkout.html" class="bg-red-600 text-white px-6 py-3 rounded hover:bg-red-700 transition">Proceed to Checkout</a>
    </div>
  </main>

  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
