<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeroDukaan - Online Shopping</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gray-50 font-['Roboto']">
  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-2xl font-bold text-red-600">MeroDukaan</a>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-red-600">Home</a>
        <a href="login.html" class="text-gray-700 hover:text-red-600">Login</a>
        <a href="cart.html" class="text-gray-700 hover:text-red-600 relative">
          <i class="fas fa-shopping-cart text-xl"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">0</span>
        </a>
      </nav>
      <button id="mobile-menu-btn" class="md:hidden text-gray-700 focus:outline-none">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md">
      <a href="index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Home</a>
      <a href="login.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Login</a>
      <a href="cart.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Cart</a>
    </div>
  </header>

  <!-- Search Bar -->
  <section class="bg-white p-4 shadow-md mt-4 mx-auto max-w-6xl rounded">
    <form id="search-form" class="flex max-w-3xl mx-auto">
      <input
        type="text"
        id="search-input"
        placeholder="Search products..."
        class="flex-grow border border-gray-300 rounded-l px-4 py-2 focus:outline-none focus:ring-2 focus:ring-red-600"
      />
      <button
        type="submit"
        class="bg-red-600 text-white px-6 rounded-r hover:bg-red-700 transition"
      >
        Search
      </button>
    </form>
  </section>

  <!-- Categories -->
  <section class="max-w-6xl mx-auto mt-8 px-4">
    <h2 class="text-2xl font-semibold mb-4">Categories</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4">
      <a href="#" class="bg-white rounded shadow p-4 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-mobile-alt text-4xl text-red-600 mb-2"></i>
        <span>Mobiles</span>
      </a>
      <a href="#" class="bg-white rounded shadow p-4 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-laptop text-4xl text-red-600 mb-2"></i>
        <span>Laptops</span>
      </a>
      <a href="#" class="bg-white rounded shadow p-4 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-tshirt text-4xl text-red-600 mb-2"></i>
        <span>Fashion</span>
      </a>
      <a href="#" class="bg-white rounded shadow p-4 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-couch text-4xl text-red-600 mb-2"></i>
        <span>Home & Living</span>
      </a>
      <a href="#" class="bg-white rounded shadow p-4 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-book text-4xl text-red-600 mb-2"></i>
        <span>Books</span>
      </a>
      <a href="#" class="bg-white rounded shadow p-4 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-baby text-4xl text-red-600 mb-2"></i>
        <span>Baby & Toys</span>
      </a>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="max-w-6xl mx-auto mt-12 px-4">
    <h2 class="text-2xl font-semibold mb-6">Featured Products</h2>
    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Products will be injected here by JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white mt-12 py-6 shadow-inner">
    <div class="max-w-6xl mx-auto text-center text-gray-600">
      &copy; 2024 Daraz Nepal. All rights reserved.
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
